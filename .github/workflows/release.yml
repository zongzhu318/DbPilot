name: 发布安装包与 Sparkle 更新
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 0.3.1，不带 v 前缀）'
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: 测试更新源生成
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: 校验版本号与公开更新密钥
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          version = os.environ['INPUT_VERSION'] if os.environ['EVENT_NAME']=='workflow_dispatch' else os.environ['TAG_NAME'].removeprefix('v')
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Version must be a stable numeric version such as 0.3.1')
          if len(base64.b64decode(os.environ['PUBLIC_KEY'], validate=True)) != 32:
              raise SystemExit('Set repository variable SPARKLE_PUBLIC_KEY to the Ed25519 public key')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'version={version}\n')
          PY
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
      REPOSITORY: ${{ github.repository }}
      PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: 离线协议与无界面 UI 检查
        run: dotnet run --project tests/DbStudio.Checks/DbStudio.Checks.csproj -c Release
      - name: 验证 macOS 打包签名回归
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: 导入 Apple 签名证书
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$CERTIFICATE" ]]; then
            printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer.p12"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
            security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
            security import "$RUNNER_TEMP/developer.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
            security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          fi
      - name: 构建 macOS DMG（含 Sparkle）
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/release/package-macos.sh
      - name: 构建 Windows EXE 安装包（含 WinSparkle）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.rid }}
          path: artifacts/installers/*
          if-no-files-found: error
      - name: 清理临时 Apple 钥匙串
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/developer.p12"
  release:
    needs: [prepare, build]
    runs-on: macos-14
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TARGET: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts/installers
      - name: 签名安装包并生成更新源
        env:
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" || { echo 'Set SPARKLE_PRIVATE_KEY secret'; exit 1; }
          mkdir -p artifacts/sparkle
          curl -fL --retry 3 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o artifacts/sparkle.tar.xz
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  artifacts/sparkle.tar.xz' | shasum -a 256 -c -
          tar -xf artifacts/sparkle.tar.xz -C artifacts/sparkle
          swift scripts/release/validate-sparkle-key.swift
          umask 077
          KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"
          python3 scripts/release/generate-appcasts.py --directory artifacts/installers --repository "$REPOSITORY" --version "$VERSION" --signer artifacts/sparkle/bin/sign_update --key-file "$KEY_FILE"
      - name: 发布 GitHub Release
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists. Use a new version to avoid mutating signed update assets.'
            exit 1
          fi
          gh release create "v$VERSION" artifacts/installers/* --repo "$REPOSITORY" --target "$RELEASE_TARGET" --title "DbStudio $VERSION" --generate-notes --latest
